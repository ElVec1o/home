<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Opus 4.6 System Prompt | elvec1o</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #a371f7;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text);
        }

        .logo img {
            height: 32px;
            width: auto;
        }

        .logo span {
            font-weight: 600;
            color: var(--accent);
        }

        .title-info h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }

        .title-info .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-tertiary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge.leak { background: rgba(255, 100, 100, 0.15); color: #ff6b6b; }
        .badge.version { background: rgba(88, 166, 255, 0.15); color: var(--accent); }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text);
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: #79b8ff;
        }

        /* Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 0.75rem 1rem;
        }

        .code-header .filename {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .code-header .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .code-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        .code-wrapper {
            display: flex;
            overflow-x: auto;
        }

        .line-numbers {
            background: var(--bg-tertiary);
            padding: 1rem 0;
            text-align: right;
            user-select: none;
            border-right: 1px solid var(--border);
            min-width: 50px;
        }

        .line-numbers span {
            display: block;
            padding: 0 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .code-content {
            flex: 1;
            padding: 1rem;
            overflow-x: auto;
        }

        .code-content pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Syntax highlighting */
        .tag { color: var(--accent-green); }
        .attr { color: var(--accent-purple); }
        .comment { color: var(--text-muted); font-style: italic; }

        /* Search */
        .search-bar {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .search-bar input {
            flex: 1;
            padding: 0.6rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-results {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 0.5rem 0;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent-green);
            color: #000;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 1rem; }
            .container { padding: 1rem; }
            .header-content { flex-direction: column; align-items: flex-start; }
            .code-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .line-numbers { display: none; }
        }

        /* Highlight */
        .highlight {
            background: rgba(255, 200, 50, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="https://elvec1o.github.io/home/" class="logo">
                    <img src="../img/logo-elvec1o.png" alt="elvec1o" onerror="this.style.display='none'">
                    <span>elvec1o</span>
                </a>
                <div class="title-info">
                    <h1>Claude Opus 4.6 System Prompt</h1>
                    <div class="meta">
                        <span class="badge leak">🔓 Leaked</span>
                        <span>Feb 6, 2026</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="copyToClipboard()" title="Copy to clipboard">
                    📋 Copy
                </button>
                <a href="opus-4.6-system-prompt.txt" download class="btn" title="Download file">
                    ⬇️ Download
                </a>
                <a href="https://elvec1o.github.io/home/files/" class="btn btn-primary">
                    ← Back to Files
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search in prompt... (Ctrl+F)" onkeyup="handleSearch(event)">
            <button class="btn" onclick="performSearch()">Search</button>
        </div>
        <div class="search-results" id="searchResults"></div>

        <div class="code-header">
            <span class="filename">opus-4.6-system-prompt.txt</span>
            <div class="stats">
                <span id="lineCount">— lines</span>
                <span id="charCount">— characters</span>
            </div>
        </div>

        <div class="code-container">
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <p>Loading system prompt...</p>
            </div>
            <div class="code-wrapper" id="codeWrapper" style="display: none;">
                <div class="line-numbers" id="lineNumbers"></div>
                <div class="code-content">
                    <pre id="codeContent"></pre>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        let rawContent = '';

        async function loadContent() {
            try {
                const response = await fetch('opus-4.6-system-prompt.txt');
                rawContent = await response.text();

                displayContent(rawContent);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('codeWrapper').style.display = 'flex';
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <p style="color: #ff6b6b;">Error loading file: ${error.message}</p>
                `;
            }
        }

        function displayContent(content) {
            const lines = content.split('\n');
            const lineNumbersEl = document.getElementById('lineNumbers');
            const codeContentEl = document.getElementById('codeContent');

            // Line numbers
            lineNumbersEl.innerHTML = lines.map((_, i) => `<span>${i + 1}</span>`).join('');

            // Content with basic syntax highlighting
            const highlighted = escapeHtml(content)
                .replace(/(&lt;\/?[\w-]+)/g, '<span class="tag">$1</span>')
                .replace(/(&gt;)/g, '<span class="tag">$1</span>');

            codeContentEl.innerHTML = highlighted;

            // Stats
            document.getElementById('lineCount').textContent = `${lines.length} lines`;
            document.getElementById('charCount').textContent = `${content.length.toLocaleString()} characters`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(rawContent).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsEl = document.getElementById('searchResults');

            if (!query) {
                displayContent(rawContent);
                resultsEl.textContent = '';
                return;
            }

            const content = rawContent;
            const regex = new RegExp(escapeRegex(query), 'gi');
            const matches = content.match(regex);

            if (matches) {
                resultsEl.textContent = `Found ${matches.length} match${matches.length > 1 ? 'es' : ''}`;

                // Highlight matches
                const highlighted = escapeHtml(content)
                    .replace(/(&lt;\/?[\w-]+)/g, '<span class="tag">$1</span>')
                    .replace(/(&gt;)/g, '<span class="tag">$1</span>')
                    .replace(new RegExp(escapeRegex(escapeHtml(query)), 'gi'), '<span class="highlight">$&</span>');

                document.getElementById('codeContent').innerHTML = highlighted;
            } else {
                resultsEl.textContent = 'No matches found';
            }
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });

        // Load on page ready
        loadContent();
    </script>
</body>
</html>
